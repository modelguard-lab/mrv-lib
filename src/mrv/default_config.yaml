# =============================================================================
# mrv-lib configuration
# =============================================================================
#
# Generated by: mrv init
#
# Usage:
#   mrv run config.yaml              # run representation invariance + generate report
#   mrv run config.yaml rep          # representation invariance only
#   mrv download config.yaml         # download data only
#
# Resolution invariance (Paper 2) is labels-first: fit your own regime models at
# each frequency and call mrv.pipeline.validate_res(labels=...) from the Python API.
#
# Override by passing a custom YAML path.

# -----------------------------------------------------------------------------
# Download: data source, asset universe, and time range
# -----------------------------------------------------------------------------
# source: yahoo (free)
#         ib (requires IB Gateway)

download:
  source: yahoo
  data_dir: data
  symbols: [SPY, USDJPY, CL=F, IEF, GLD]
  freq: [5m, 15m, 1h, 1d]
  start: "2024-01-01"
  end: null

  # IB Gateway (only used when source: ib)
  ib:
    host: 127.0.0.1
    port: 4002
    client_id: null
    tz: America/New_York
    duration_chunk: "1 W"
    use_rth: false
    future_expiry:
      CL: CONTFUT

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------

logging:
  level: INFO
  format: "%(asctime)s %(levelname)s [%(name)s] %(message)s"
  log_dir: null                   # null = console only; set to "logs" for file
  quiet:
    - hmmlearn
    - urllib3
    - matplotlib

# -----------------------------------------------------------------------------
# Factors: rolling window parameters for feature engineering
# -----------------------------------------------------------------------------

factors:
  vol_window: 20
  drawdown_window: 60
  tail_window: 60
  tail_alpha: 0.05
  skew_window: 60
  stability_window: 60

# -----------------------------------------------------------------------------
# Normalization
# -----------------------------------------------------------------------------

normalize:
  mode: rolling_zscore            # rolling_zscore | minmax | none
  window: 120

# -----------------------------------------------------------------------------
# Validator
# -----------------------------------------------------------------------------

validator:
  report_dir: reports
  report_name: "mrv_report_{date}"
  # Report template
  #   null : use the packaged specification-invariance report (rep + res).
  #   Set a path to override with your own .tex template.
  report_template: null
  findings_overrides: null

  # Representation Invariance (Paper 1)
  rep:
    assets:
      SPY: data/SPY_5m.csv
    model: gmm
    attribution: false
    factors:
      - [vol, drawdown, maxdd, var, cvar]
      - [vol, drawdown, var, cvar]
      - [real_skew, vol_stab, var, cvar]
    monitoring:
      alert_ari_below: 0.3
      alert_ari_delta: -0.15
      alert_channels:
        - type: file

  # Resolution Invariance (Paper 2)
  res:
    assets:
      SPY: [data/SPY_5m.csv, data/SPY_15m.csv, data/SPY_1h.csv, data/SPY_1d.csv]
    model: gmm
    attribution: false
    factors: [vol, drawdown, var, cvar]
    monitoring:
      alert_ari_below: 0.3
      alert_ari_delta: -0.15
      alert_channels:
        - type: file
