[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrv-lib"
version = "0.6.1"
authors = [
  { name = "Kai Zheng", email = "kai.zheng@mrv-lib.org" },
]
description = "Model Risk Validator: specification-invariance testing for financial models"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
keywords = [
  "model-risk", "validation", "SR-26-2", "SR-11-7", "regime",
  "invariance", "specification-risk", "OCC-2026-13",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "pyyaml>=5.4",
  "scipy>=1.9",
  "matplotlib>=3.5",
  "scikit-learn>=1.2",
  "hmmlearn>=0.3",
  "yfinance>=0.2.30",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "ruff", "mypy"]
examples = ["jupyter", "ipykernel", "matplotlib", "scikit-learn"]
docs = [
  "sphinx>=7",
  "furo",
  "sphinx-autodoc-typehints",
  "myst-parser",
]

[project.urls]
Homepage = "https://mrv-lib.org"
Repository = "https://github.com/modelguard-lab/mrv-lib"
Issues = "https://github.com/modelguard-lab/mrv-lib/issues"
Changelog = "https://github.com/modelguard-lab/mrv-lib/blob/main/CHANGELOG.md"

[project.scripts]
mrv = "mrv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mrv = ["default_config.yaml", "py.typed", "templates/*.tex"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning:sklearn",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
